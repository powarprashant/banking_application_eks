name: DevSecOps CI/CD - Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - "services/**"
      - "frontend/**"
      - "pkg/**"
      - "proto/**"
      - "build/**"
      - "deploy/helm/**"
      - ".github/workflows/ci.yaml"

  pull_request:
    paths:
      - "services/**"
      - "frontend/**"
      - "pkg/**"
      - "proto/**"
      - "build/**"
      - "deploy/helm/**"
      - ".github/workflows/ci.yaml"

  workflow_dispatch:

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_PREFIX: prashantkpowar/banking-platform

  # Security gate configuration
  TRIVY_SEVERITY: HIGH,CRITICAL
  TRIVY_IGNORE_UNFIXED: true

jobs:

  # ===========================================================================
  # JOB 1 - GITLEAKS
  # ===========================================================================
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # JOB 2 - SONARQUBE
  # ===========================================================================
  sonarqube:
    name: SonarQube Code Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Optional quality gate.
      # Enable this if your SonarQube server has a quality gate configured.

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ===========================================================================
  # JOB 3 - OWASP DEPENDENCY CHECK
  # ===========================================================================
  owasp:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "banking-platform"
          path: "."
          format: "HTML"
          args: >
            --scan .
            --enableRetired
            --failOnCVSS 7

      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: reports/

  # ===========================================================================
  # JOB 4 - TRIVY FILESYSTEM SCAN
  # ===========================================================================
  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: MEDIUM
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

      - name: Trivy filesystem SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: MEDIUM
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "0"

      - name: Upload Trivy filesystem report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-report
          path: trivy-fs.sarif

  # ===========================================================================
  # JOB 5 - BUILD + SECURITY SCAN + DOCKER HUB PUSH
  # ===========================================================================
  build:
    name: Build (${{ matrix.service }})

    runs-on: ubuntu-latest

    needs:
      - gitleaks
      - sonarqube
      - owasp
      - trivy-filesystem

    strategy:
      fail-fast: false

      matrix:
        service:

          - auth-service
          - authz-service
          - customer-service
          - profile-service
          - kyc-service
          - document-service
          - ledger-service
          - account-service
          - transaction-service
          - beneficiary-service
          - payment-service
          - wallet-service
          - loan-service
          - emi-service
          - fixed-deposit-service
          - recurring-deposit-service
          - card-service
          - investment-service
          - currency-exchange-service
          - audit-service
          - fraud-service
          - notification-service
          - statement-service
          - reports-service
          - analytics-service
          - search-service
          - email-service
          - sms-service
          - support-service
          - admin-service
          - api-gateway
          - frontend

    steps:

      # -----------------------------------------------------------------------
      # CHECKOUT
      # -----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # COMPUTE SHA
      # -----------------------------------------------------------------------

      - name: Compute short SHA
        id: vars
        shell: bash
        run: |
          SHA=$(echo "${GITHUB_SHA}" | cut -c1-12)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # RESOLVE BUILD INPUTS
      # -----------------------------------------------------------------------

      - name: Resolve build inputs
        id: img
        shell: bash
        run: |

          if [ "${{ matrix.service }}" = "frontend" ]; then

            echo "context=./frontend" >> "$GITHUB_OUTPUT"
            echo "dockerfile=./frontend/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "buildargs=" >> "$GITHUB_OUTPUT"

          else

            echo "context=." >> "$GITHUB_OUTPUT"
            echo "dockerfile=build/service.Dockerfile" >> "$GITHUB_OUTPUT"
            echo "buildargs=SERVICE=${{ matrix.service }}" >> "$GITHUB_OUTPUT"

          fi

      # -----------------------------------------------------------------------
      # DOCKER BUILDX
      # -----------------------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # BUILD DOCKER IMAGE
      # -----------------------------------------------------------------------

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:

          context: ${{ steps.img.outputs.context }}

          file: ${{ steps.img.outputs.dockerfile }}

          build-args: ${{ steps.img.outputs.buildargs }}

          push: false

          load: true

          tags: |
            ${{ env.IMAGE_PREFIX }}:${{ matrix.service }}-${{ steps.vars.outputs.sha }}
            ${{ env.IMAGE_PREFIX }}:${{ matrix.service }}-latest

          cache-from: type=gha,scope=${{ matrix.service }}

          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      # -----------------------------------------------------------------------
      # TRIVY DOCKER IMAGE SCAN
      # -----------------------------------------------------------------------

      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@0.36.0
        with:

          scan-type: image

          image-ref: ${{ env.IMAGE_PREFIX }}:${{ matrix.service }}-${{ steps.vars.outputs.sha }}

          format: table

          severity: HIGH,CRITICAL

          ignore-unfixed: true

          vuln-type: os,library

          # SECURITY GATE
          #
          # Pipeline fails when HIGH/CRITICAL vulnerabilities are found.
          #
          exit-code: "1"

      # -----------------------------------------------------------------------
      # TRIVY IMAGE SARIF REPORT
      # -----------------------------------------------------------------------

      - name: Trivy Docker image SARIF
        if: always()
        uses: aquasecurity/trivy-action@0.36.0
        with:

          scan-type: image

          image-ref: ${{ env.IMAGE_PREFIX }}:${{ matrix.service }}-${{ steps.vars.outputs.sha }}

          format: sarif

          output: trivy-image.sarif

          severity: HIGH,CRITICAL

          ignore-unfixed: true

          vuln-type: os,library

          exit-code: "0"

      # -----------------------------------------------------------------------
      # UPLOAD TRIVY REPORT
      # -----------------------------------------------------------------------

      - name: Upload Trivy image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-image.sarif

      # -----------------------------------------------------------------------
      # DOCKER HUB LOGIN
      # -----------------------------------------------------------------------

      - name: Login to Docker Hub
        if: >
          (github.event_name == 'push' ||
           github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'

        uses: docker/login-action@v3
        with:

          username: ${{ secrets.DOCKERHUB_USERNAME }}

          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # PUSH IMAGE
      #
      # IMPORTANT:
      #
      # This step runs only after:
      #
      # Gitleaks
      # SonarQube
      # OWASP
      # Trivy filesystem
      # Docker build
      # Trivy Docker image scan
      #
      # have passed.
      # -----------------------------------------------------------------------

      - name: Push Docker image to Docker Hub
        if: >
          (github.event_name == 'push' ||
           github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'

        uses: docker/build-push-action@v6

        with:

          context: ${{ steps.img.outputs.context }}

          file: ${{ steps.img.outputs.dockerfile }}

          build-args: ${{ steps.img.outputs.buildargs }}

          push: true

          tags: |
            ${{ env.IMAGE_PREFIX }}:${{ matrix.service }}-${{ steps.vars.outputs.sha }}
            ${{ env.IMAGE_PREFIX }}:${{ matrix.service }}-latest

          cache-from: type=gha,scope=${{ matrix.service }}

  # ===========================================================================
  # JOB 6 - GITOPS UPDATE
  # ===========================================================================
  update-gitops:
    name: Update GitOps

    runs-on: ubuntu-latest

    needs:
      - build

    if: >
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:

      # -----------------------------------------------------------------------
      # CHECKOUT
      # -----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITOPS_TOKEN || secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # SHA
      # -----------------------------------------------------------------------

      - name: Compute short SHA
        id: vars
        run: |
          echo "sha=$(echo "${GITHUB_SHA}" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # INSTALL YQ
      # -----------------------------------------------------------------------

      - name: Install yq
        run: |

          sudo curl -sL \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -o /usr/local/bin/yq

          sudo chmod +x /usr/local/bin/yq

      # -----------------------------------------------------------------------
      # UPDATE HELM VALUES
      # -----------------------------------------------------------------------

      - name: Update image strings in values.yaml
        env:
          NEW_TAG: ${{ steps.vars.outputs.sha }}

        run: |

          set -euo pipefail

          FILE="deploy/helm/banking-platform/values.yaml"

          SERVICES="$(ls services) frontend"

          to_camel() {

            local IFS='-'

            read -ra p <<< "$1"

            local out="${p[0]}"

            for w in "${p[@]:1}"; do

              out+="${w^}"

            done

            echo "$out"
          }

          for svc in $SERVICES; do

            key="$(to_camel "$svc")"

            img="${IMAGE_PREFIX}:${svc}-${NEW_TAG}"

            echo "Updating ${key} -> ${img}"

            IMG="$img" \
            yq -i \
              ".${key}.image = strenv(IMG)" \
              "$FILE"

          done

      # -----------------------------------------------------------------------
      # SHOW CHANGES
      # -----------------------------------------------------------------------

      - name: Show GitOps changes
        run: |
          git diff -- deploy/helm/banking-platform/values.yaml

      # -----------------------------------------------------------------------
      # COMMIT
      # -----------------------------------------------------------------------

      - name: Commit GitOps update
        env:
          NEW_TAG: ${{ steps.vars.outputs.sha }}

        run: |

          set -euo pipefail

          git config user.name "banking-ci[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- deploy/helm/banking-platform/values.yaml; then

            echo "No image changes to commit."

            exit 0

          fi

          git add deploy/helm/banking-platform/values.yaml

          git commit \
            -m "ci(gitops): bump image tags to ${NEW_TAG} [skip ci]"

          git push origin main