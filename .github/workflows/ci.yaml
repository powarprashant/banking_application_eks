name: DevSecOps CI/CD - Amazon ECR

on:
  push:
    branches:
      - main
    paths:
      - "services/**"
      - "frontend/**"
      - "pkg/**"
      - "proto/**"
      - "build/**"
      - "deploy/helm/**"
      - ".github/workflows/**"
      - "sonar-project.properties"
      - "go.work"

  pull_request:
    paths:
      - "services/**"
      - "frontend/**"
      - "pkg/**"
      - "proto/**"
      - "build/**"
      - "deploy/helm/**"
      - ".github/workflows/**"
      - "sonar-project.properties"
      - "go.work"

  workflow_dispatch:

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Security gate configuration
  TRIVY_SEVERITY: HIGH,CRITICAL
  TRIVY_IGNORE_UNFIXED: true

jobs:

  # ===========================================================================
  # JOB 1 - GITLEAKS
  # ===========================================================================
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ===========================================================================
  # JOB 3 - OWASP DEPENDENCY CHECK
  # ===========================================================================
  owasp:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Create reports directory
        run: mkdir -p reports

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "banking-platform"
          path: "."
          format: "HTML"
          args: >
            --scan .
            --out reports
            --enableRetired
            --failOnCVSS 8

      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: reports/

  # ===========================================================================
  # JOB 4 - TRIVY FILESYSTEM SCAN
  # ===========================================================================
  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          vuln-type: os,library

      - name: Trivy filesystem SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "0"

      - name: Upload Trivy filesystem report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-report
          path: trivy-fs.sarif

  # ===========================================================================
  # JOB 5 - BUILD + SECURITY SCAN + DOCKER HUB PUSH
  # ===========================================================================
  build:
    name: Build (${{ matrix.service }})

    runs-on: ubuntu-latest

    needs:
      - gitleaks
      - owasp
      - trivy-filesystem

    strategy:
      fail-fast: false

      matrix:
        service:

          - auth-service
          - authz-service
          - customer-service
          - profile-service
          - kyc-service
          - document-service
          - ledger-service
          - account-service
          - transaction-service
          - beneficiary-service
          - payment-service
          - wallet-service
          - loan-service
          - emi-service
          - fixed-deposit-service
          - recurring-deposit-service
          - card-service
          - investment-service
          - currency-exchange-service
          - audit-service
          - fraud-service
          - notification-service
          - statement-service
          - reports-service
          - analytics-service
          - search-service
          - email-service
          - sms-service
          - support-service
          - admin-service
          - api-gateway
          - frontend

    steps:

      # -----------------------------------------------------------------------
      # CHECKOUT
      # -----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Dockerfile
        run: |
          pwd
          ls -la
          find . -iname 'Dockerfile*' -not -path './.git/*'

      # -----------------------------------------------------------------------
      # COMPUTE SHA
      # -----------------------------------------------------------------------

      - name: Compute short SHA
        id: vars
        shell: bash
        run: |
          SHA=$(echo "${GITHUB_SHA}" | cut -c1-12)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # RESOLVE BUILD INPUTS
      # -----------------------------------------------------------------------

      - name: Resolve build inputs
        id: img
        shell: bash
        run: |

          if [ "${{ matrix.service }}" = "frontend" ]; then

            echo "context=./frontend" >> "$GITHUB_OUTPUT"
            echo "dockerfile=./frontend/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "buildargs=" >> "$GITHUB_OUTPUT"

          else

            echo "context=." >> "$GITHUB_OUTPUT"
            echo "dockerfile=build/service.Dockerfile" >> "$GITHUB_OUTPUT"
            echo "buildargs=SERVICE=${{ matrix.service }}" >> "$GITHUB_OUTPUT"

          fi

      # -----------------------------------------------------------------------
      # DOCKER BUILDX
      # -----------------------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # BUILD DOCKER IMAGE
      # -----------------------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ matrix.service }}-${{ steps.vars.outputs.sha }}
          CONTEXT: ${{ steps.img.outputs.context }}
          DOCKERFILE: ${{ steps.img.outputs.dockerfile }}
          BUILDARGS: ${{ steps.img.outputs.buildargs }}
        run: |
          set -euo pipefail

          BUILD_ARG_FLAGS=()
          if [ -n "$BUILDARGS" ]; then
            BUILD_ARG_FLAGS=(--build-arg "$BUILDARGS")
          fi

          IMAGE="$REGISTRY/$REPOSITORY"

          docker build \
            -f "$DOCKERFILE" \
            "${BUILD_ARG_FLAGS[@]}" \
            -t "$IMAGE:$IMAGE_TAG" \
            "$CONTEXT"

          docker push "$IMAGE:$IMAGE_TAG"

      # -----------------------------------------------------------------------
      # TRIVY DOCKER IMAGE SCAN
      # -----------------------------------------------------------------------

      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:

          scan-type: image

          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ matrix.service }}-${{ steps.vars.outputs.sha }}

          format: table

          severity: HIGH,CRITICAL

          ignore-unfixed: true

          vuln-type: os,library

          # SECURITY GATE
          #
          # Pipeline fails when HIGH/CRITICAL vulnerabilities are found.
          #
          exit-code: "1"

      # -----------------------------------------------------------------------
      # TRIVY IMAGE SARIF REPORT
      # -----------------------------------------------------------------------

      - name: Trivy Docker image SARIF
        if: success()
        uses: aquasecurity/trivy-action@v0.36.0
        with:

          scan-type: image

          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ matrix.service }}-${{ steps.vars.outputs.sha }}

          format: sarif

          output: trivy-image.sarif

          severity: HIGH,CRITICAL

          ignore-unfixed: true

          vuln-type: os,library

          exit-code: "0"

      # -----------------------------------------------------------------------
      # UPLOAD TRIVY REPORT
      # -----------------------------------------------------------------------

      - name: Upload Trivy image report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-image.sarif

    

  # ===========================================================================
  # JOB 6 - GITOPS UPDATE
  # ===========================================================================
  update-gitops:
    name: Update GitOps

    runs-on: ubuntu-latest

    needs:
      - build

    if: >
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:

      # -----------------------------------------------------------------------
      # CHECKOUT
      # -----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITOPS_TOKEN || secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # SHA
      # -----------------------------------------------------------------------

      - name: Compute short SHA
        id: vars
        run: |
          echo "sha=$(echo "${GITHUB_SHA}" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # RESOLVE ECR REGISTRY (must match what the build job pushed)
      # -----------------------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------------------------------------------
      # INSTALL YQ
      # -----------------------------------------------------------------------

      - name: Install yq
        run: |

          sudo curl -sL \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -o /usr/local/bin/yq

          sudo chmod +x /usr/local/bin/yq

      # -----------------------------------------------------------------------
      # UPDATE HELM VALUES
      # -----------------------------------------------------------------------

      - name: Update image strings in values.yaml
        env:
          NEW_TAG: ${{ steps.vars.outputs.sha }}
          IMAGE_REPO: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}

        run: |

          set -euo pipefail

          FILE="deploy/helm/banking-platform/values.yaml"

          SERVICES="$(ls services) frontend"

          to_camel() {

            local IFS='-'

            read -ra p <<< "$1"

            local out="${p[0]}"

            for w in "${p[@]:1}"; do

              out+="${w^}"

            done

            echo "$out"
          }

          for svc in $SERVICES; do

            key="$(to_camel "$svc")"

            img="${IMAGE_REPO}:${svc}-${NEW_TAG}"

            echo "Updating ${key} -> ${img}"

            IMG="$img" \
            yq -i \
              ".${key}.image = strenv(IMG)" \
              "$FILE"

          done

      # -----------------------------------------------------------------------
      # SHOW CHANGES
      # -----------------------------------------------------------------------

      - name: Show GitOps changes
        run: |
          git diff -- deploy/helm/banking-platform/values.yaml

      # -----------------------------------------------------------------------
      # COMMIT
      # -----------------------------------------------------------------------

      - name: Commit GitOps update
        env:
          NEW_TAG: ${{ steps.vars.outputs.sha }}

        run: |

          set -euo pipefail

          git config user.name "banking-ci[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- deploy/helm/banking-platform/values.yaml; then

            echo "No image changes to commit."

            exit 0

          fi

          git add deploy/helm/banking-platform/values.yaml

          git commit \
            -m "ci(gitops): bump image tags to ${NEW_TAG} [skip ci]"

          git push origin main